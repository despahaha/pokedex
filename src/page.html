<title>Pokédex White</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one handheld column. Red device bar on top, five thumb tabs fixed at the bottom,
   content as "windows" with an ink title bar, hard pixel borders and offset shadows. */
:root {
  --bg: #dfe5ea;
  --panel: #f8fafb;
  --panel-2: #cfd8df;
  --ink: #1a2030;
  --mute: #566176;
  --red: #d63a2c;
  --red-ink: #fff6ee;
  --hi: #ffd84a;
  --good: #2f9e52;
  --bad: #cf4a3c;
  --zero: #3a4152;
  --on-mark: #ffffff;
  --title: #1a2030;
  --title-ink: #f8fafb;
  --px: "Press Start 2P", "Courier New", monospace;
  --tx: "VT323", "Menlo", "Courier New", monospace;
  --bar-h: 46px;
  --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161f; --panel: #1e2431; --panel-2: #2b3345; --ink: #e8edf6; --mute: #9aa6bb;
    --red: #c93426; --red-ink: #fff6ee; --hi: #e9bf2c; --good: #3fb968; --bad: #e2604f; --zero: #6b7489; --on-mark: #10141c;
    --title: #3a4560; --title-ink: #f1f4fa;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161f; --panel: #1e2431; --panel-2: #2b3345; --ink: #e8edf6; --mute: #9aa6bb;
  --red: #c93426; --red-ink: #fff6ee; --hi: #e9bf2c; --good: #3fb968; --bad: #e2604f; --zero: #6b7489; --on-mark: #10141c;
  --title: #3a4560; --title-ink: #f1f4fa;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--tx); font-size: 20px; line-height: 1.15;
  -webkit-font-smoothing: none; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--safe-t); z-index: 10; background: var(--red); }
button, input, textarea { font: inherit; color: inherit; border-radius: 0; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--hi); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* device bar */
.top { position: sticky; top: var(--safe-t); z-index: 9; background: var(--red); color: var(--red-ink); border-bottom: 4px solid #1a2030; height: var(--bar-h); }
.top .wrap { height: 100%; display: flex; align-items: center; gap: 10px; }
.lens { width: 22px; height: 22px; background: #6fd0ff; border: 3px solid var(--red-ink); box-shadow: inset -4px -4px 0 #2b86c9; flex: none; }
.top h1 { font-family: var(--px); font-size: 14px; margin: 0; letter-spacing: 1px; }
.dots { display: flex; gap: 5px; margin-left: 4px; }
.dots i { width: 8px; height: 8px; border: 2px solid #1a2030; }
.topbtn { margin-left: auto; background: rgba(0,0,0,.25); color: var(--red-ink); border: 3px solid #1a2030; padding: 2px 10px; font-size: 20px; min-height: 34px; }
.topbtn[aria-pressed="true"] { background: var(--red-ink); color: #1a2030; }

/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--panel); border-top: 4px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: flex; gap: 5px; padding-block: 6px; }
.tabs button { flex: 1 1 0; min-width: 0; min-height: 46px; background: var(--panel-2); border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 20px; padding: 2px 0; }
.tabs button[aria-selected="true"] { background: var(--red); color: var(--red-ink); box-shadow: inset 0 -5px 0 rgba(0,0,0,.25); }
.tabs .n { font-family: var(--px); font-size: 7px; background: var(--hi); color: #14181f; border: 2px solid #1a2030; padding: 3px 3px 2px; }

main { padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.box { background: var(--panel); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 10px; scroll-margin-top: calc(var(--safe-t) + var(--bar-h) + 62px); }
.box > h2 { background: var(--title); color: var(--title-ink); margin: -10px -10px 10px; padding: 5px 10px 6px; font-family: var(--tx); font-weight: normal; font-size: 23px; line-height: 1.05; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
.box > h2 .ico { font-family: var(--px); font-size: 10px; color: var(--hi); }
.box > h2 .end { margin-left: auto; display: flex; gap: 4px; }
.note { color: var(--mute); font-size: 18px; margin: 0 0 10px; }
.note:last-child { margin-bottom: 0; }
.group { font-family: var(--px); font-size: 10px; margin: 6px 0 -4px; color: var(--mute); text-transform: uppercase; }

/* list tools */
.tools { position: sticky; top: calc(var(--safe-t) + var(--bar-h)); z-index: 5; background: var(--bg); margin: -12px 0 -4px; padding: 12px 0 8px; display: flex; flex-direction: column; gap: 8px; }
.search { width: 100%; min-width: 0; background: var(--panel); border: 3px solid var(--ink); padding: 8px 10px; font-size: 22px; box-shadow: 4px 4px 0 var(--ink); -webkit-appearance: none; appearance: none; }
.search::placeholder { color: var(--mute); }
.search::-webkit-search-cancel-button { display: none; }
.searchwrap { position: relative; }
.searchwrap .search { padding-right: 46px; }
#q-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; background: none; border: 0; font-size: 24px; color: var(--mute); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { background: var(--panel); border: 3px solid var(--ink); padding: 4px 8px; font-size: 20px; min-height: 36px; white-space: nowrap; }
.chip[aria-pressed="true"], .chip[aria-expanded="true"] { background: var(--ink); color: var(--panel); }
.chip.push { margin-left: auto; }
.typebar { display: flex; flex-wrap: wrap; gap: 7px; background: var(--panel); border: 3px solid var(--ink); padding: 10px; }
.count { color: var(--mute); font-size: 18px; }

.ty { display: inline-block; font-family: var(--px); font-size: 8px; line-height: 1; text-transform: uppercase; padding: 4px 5px 3px; border: 2px solid #1a2030; color: #14181f; white-space: nowrap; }
.ty.w { color: #fff; }
button.ty { padding: 9px 7px 8px; }
button.ty[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--hi), 0 0 0 5px var(--ink); }

.list { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
.row { width: 100%; text-align: left; display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; background: var(--panel); border: 3px solid var(--ink); padding: 6px 8px 6px 6px; box-shadow: 3px 3px 0 var(--ink); }
.row:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.tile { width: 70px; height: 70px; border: 3px solid #1a2030; grid-row: span 2; image-rendering: pixelated; image-rendering: crisp-edges; max-width: none; display: block; }
.row .nm { font-size: 24px; line-height: 1; overflow-wrap: anywhere; }
.row .no { font-family: var(--px); font-size: 8px; color: var(--mute); margin-right: 6px; }
.row .tys { display: flex; gap: 4px; flex-wrap: wrap; }
.row .ev { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-size: 20px; max-width: 118px; }
.row .ev b { font-weight: normal; background: var(--hi); color: #14181f; padding: 1px 5px; border: 2px solid #1a2030; display: inline-block; }
.row .ev i { font-style: normal; color: var(--mute); }
.star { color: var(--bad); }
.got { color: var(--good); }
.empty { text-align: center; color: var(--mute); padding: 20px 0; }
.prow { grid-template-columns: minmax(0, 1fr) auto; padding: 9px 10px; font-size: 23px; }
.prow span:last-child { color: var(--mute); font-size: 19px; }

/* detail */
.dnav { display: flex; gap: 8px; align-items: stretch; }
.btn { background: var(--panel); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 5px 10px; font-size: 20px; min-height: 40px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn[disabled] { opacity: .4; }
.btn[aria-pressed="true"] { background: var(--hi); color: #14181f; }
.dnav .grow { margin-right: auto; }
.flat { box-shadow: none; background: var(--panel-2); }
.wide { width: 100%; margin-top: 10px; }
.hero { display: grid; grid-template-columns: 102px minmax(0, 1fr); gap: 12px; align-items: center; }
.hero .tile { width: 102px; height: 102px; grid-row: auto; }
.tile[data-fb] { padding: 2px; }
.hero .tile[data-fb] { padding: 8px; }
.hero .no { font-family: var(--px); font-size: 8px; color: var(--mute); line-height: 1.7; }
.hero h2 { font-family: var(--tx); font-size: 38px; font-weight: normal; margin: 0; line-height: .95; overflow-wrap: anywhere; }
.hero .ge { color: var(--mute); font-size: 19px; margin-bottom: 5px; }
.hero .tys { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.acts { grid-column: 1 / -1; display: flex; gap: 8px; }
.acts .btn { flex: 1 1 0; min-width: 0; padding-inline: 4px; }

.jump { position: sticky; top: calc(var(--safe-t) + var(--bar-h)); z-index: 5; background: var(--bg); margin: -6px 0; padding: 6px 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.jump::-webkit-scrollbar { display: none; }
.jump .chip { flex: 1 0 auto; text-align: center; padding-inline: 6px; }

.next { background: var(--hi); color: #14181f; border: 3px solid #1a2030; padding: 8px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.next .lv { font-size: 26px; line-height: 1; text-transform: uppercase; }
.next.done { background: var(--panel-2); color: var(--ink); border-color: var(--ink); }
.edges { display: flex; flex-direction: column; gap: 8px; }
.edge { border-top: 2px dashed var(--mute); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.edge:first-child { border-top: 0; padding-top: 0; }
.edge .pair { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mon { background: var(--panel-2); border: 2px solid var(--ink); padding: 2px 8px 2px 2px; font-size: 21px; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; text-align: left; }
.mon img { width: 32px; height: 32px; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; background: #e9eef2; }
.mon.me { background: var(--ink); color: var(--panel); }
.edge .how { color: var(--mute); font-size: 19px; }

.locs { display: flex; flex-direction: column; }
.loc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 0; border-top: 2px dashed var(--mute); align-items: center; }
.loc:first-child { border-top: 0; padding-top: 0; }
.loc .pl { font-size: 22px; grid-column: 1 / -1; background: none; border: 0; padding: 0; text-align: left; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
.loc .pl.plain { text-decoration: none; }
.loc .how { color: var(--mute); font-size: 19px; }
.loc .rt { text-align: right; font-size: 19px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.loc .rt b { font-weight: normal; background: var(--panel-2); border: 2px solid var(--ink); padding: 0 5px; }
.warn { background: var(--panel-2); border: 3px solid var(--ink); padding: 8px; margin: 0 0 10px; }
.warn:last-child { margin-bottom: 0; }

.mv { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 1px 8px; padding: 6px 0; border-top: 2px dashed var(--mute); align-items: center; }
.mv:first-child { border-top: 0; padding-top: 0; }
.mv .lv { font-family: var(--px); font-size: 8px; color: var(--mute); }
.mv .mn { font-size: 22px; overflow-wrap: anywhere; }
.mv .ms { grid-column: 2 / -1; color: var(--mute); font-size: 18px; }
.mv .ms b { font-weight: normal; color: var(--good); }

.eff { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px 10px; align-items: start; }
.mult { font-family: var(--px); font-size: 10px; text-align: center; padding: 6px 0 5px; border: 2px solid #1a2030; color: var(--on-mark); }
.mult.g { background: var(--good); } .mult.b { background: var(--bad); } .mult.z { background: var(--zero); }
.eff .tys { display: flex; flex-wrap: wrap; gap: 5px; padding-top: 2px; }
.eff .lbl { grid-column: 1 / -1; color: var(--mute); font-size: 18px; }
.eff .none { color: var(--mute); font-size: 18px; }
.sub { margin: 12px 0 8px; display: flex; align-items: center; gap: 8px; font-size: 20px; }
.sub:first-of-type { margin-top: 0; }

.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.facts dt { color: var(--mute); }
.facts dd { margin: 0; }
.facts small { color: var(--mute); font-size: 18px; }
.stats { display: grid; grid-template-columns: auto 34px minmax(0, 1fr); gap: 5px 8px; align-items: center; font-variant-numeric: tabular-nums; }
.stats .bar { height: 12px; background: var(--panel-2); border: 2px solid var(--ink); }
.stats .bar i { display: block; height: 100%; background: var(--good); }
.stats .v { text-align: right; }

/* team, bosses */
.cover { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 10px; align-items: center; }
.cover .who { font-size: 19px; }
.cover .who.no { color: var(--mute); }
.squad { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.squad .m { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.squad .m .r { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.squad .m .l { font-family: var(--px); font-size: 8px; }
.tips { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.tips .t { display: inline-flex; align-items: center; gap: 4px; font-size: 19px; }

/* options */
.sizes { display: flex; gap: 6px; }
.sizes .btn { flex: 1 1 0; min-width: 0; padding-inline: 2px; }
.code { width: 100%; min-height: 78px; background: var(--panel-2); border: 3px solid var(--ink); padding: 6px; font-size: 18px; resize: vertical; overflow-wrap: anywhere; }
.meter { height: 16px; background: var(--panel-2); border: 2px solid var(--ink); margin: 4px 0 10px; }
.meter i { display: block; height: 100%; background: var(--good); }
.status { min-height: 22px; margin: 8px 0 0; }

.picker { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.scroll { overflow-x: auto; }
table.mx { border-collapse: collapse; font-family: var(--px); font-size: 7px; }
.mx th, .mx td { border: 1px solid var(--mute); width: 17px; min-width: 17px; height: 19px; text-align: center; padding: 0; }
.mx th { color: #14181f; }
.mx th.w { color: #fff; }
.mx th.corner { background: var(--panel-2); color: var(--ink); font-size: 5px; min-width: 30px; }
.mx thead th { height: 34px; }
.mx thead th span { display: inline-block; writing-mode: vertical-rl; }
.mx tbody th { min-width: 30px; position: sticky; left: 0; }
.mx td.g { background: var(--good); color: var(--on-mark); } .mx td.b { background: var(--bad); color: var(--on-mark); } .mx td.z { background: var(--zero); color: var(--on-mark); }
@media (prefers-reduced-motion: reduce) { .row:active, .btn:active { transform: none; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="lens"></div><h1>POKéDEX</h1>
    <div class="dots"><i style="background:#e9483a"></i><i style="background:#ffd84a"></i><i style="background:#4bc56d"></i></div>
    <button class="topbtn" id="open-more" aria-pressed="false">Options</button>
  </div>
</header>

<div class="wrap">
  <main id="view-list">
    <div class="tools">
      <div class="searchwrap">
        <input class="search" id="q" type="search" placeholder="Name, number, type, “lv 17”…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search Pokémon by name, number, type, ability or evolution level">
        <button id="q-clear" aria-label="Clear search" hidden>✕</button>
      </div>
      <div class="seg">
        <button class="chip" id="dex-unova" aria-pressed="true">Unova</button>

<script>
const DATA = /*DATA*/;
const T = DATA.types, C = DATA.chart, M = DATA.mons, LOCS = DATA.locs, MOVES = DATA.moves, TMS = DATA.tms;
const COL = ['#a8a878','#c03028','#a890f0','#a040a0','#e0c068','#b8a038','#a8b820','#705898','#b8b8d0','#f08030','#6890f0','#78c850','#f8d030','#f85888','#98d8d8','#7038f8','#705848'];
const WHITE = new Set([1,3,7,15,16]);
const STAT = ['HP','Attack','Defense','Sp. Atk','Sp. Def','Speed'];
/* same order as DATA.meths */
const METH = ['Tall grass / cave floor','Dark grass (double battles)','Rustling grass','Dust cloud in cave','Shadow on bridge','Surfing','Rippling water (Surf)','Fishing (Super Rod)','Fishing in rippling water','Gift','Gift egg','Fixed encounter (once)'];
const SEASON = ['Spring','Summer','Autumn','Winter'];
const CLASS = ['', 'Status', 'Physical', 'Special'];
const byId = new Map(M.map(m => [m.i, m]));
const kids = new Map();
M.forEach(m => { if (m.f) { if (!kids.has(m.f)) kids.set(m.f, []); kids.get(m.f).push(m); } });
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(3, '0');

/* saved on this device only */
const load = k => { try { return new Set(JSON.parse(localStorage.getItem(k) || '[]')); } catch (e) { return new Set(); } };
const store = (k, v) => { try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify([...v])); } catch (e) {} };
let party = load('party'), caught = load('caught');
const saveParty = () => { store('party', party); $('team-n').textContent = party.size; };
const saveCaught = () => store('caught', caught);

const state = { dex: 'unova', q: '', type: -1, onlyNew: false, atk: 9, def: [11], allLocs: false, allTms: false };

/*SPRITES*/
/* Pictures are the Black/White sprites, loaded from the PokeAPI sprite host and never copied into this app.
   An empty SPRITE_URL (the claude.ai build, where outside images are blocked) uses the drawn mascots only. */
const SPRITE_URL = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/';
const pic = (m, attrs = '') => SPRITE_URL
  ? `<img ${attrs} src="${SPRITE_URL}${m.i}.png" data-mon="${m.i}" crossorigin="anonymous" loading="lazy" alt="">`
  : `<img ${attrs} src="${sprite(m)}" data-fb="1" alt="">`;
const tile = m => pic(m, `class="tile" style="background:${mix(COL[m.t[0]], 255, .68)}"`);
/* a sprite that fails to load (offline and never seen, or the host is down) is replaced by the drawn mascot */
document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName !== 'IMG' || !img.dataset.mon || img.dataset.fb) return;
  img.dataset.fb = '1';
  img.removeAttribute('crossorigin');
  img.src = sprite(byId.get(+img.dataset.mon));
}, true);
const badge = (t, tag = 'span', extra = '') =>
  `<${tag} class="ty${WHITE.has(t) ? ' w' : ''}" style="background:${COL[t]}"${extra}>${T[t]}</${tag}>`;
const num = m => state.dex === 'unova' && m.u !== undefined ? pad(m.u) : pad(m.i);
const marks = m => (party.has(m.i) ? ' <span class="star">★</span>' : '') + (caught.has(m.i) ? ' <span class="got">✔</span>' : '');

function hint(m) {
  const k = kids.get(m.i);
  if (!k) return '<i>—</i>';
  if (k.length > 1) return `<b>${k.length} paths</b>`;
  return `<b>${esc(k[0].m[0][0])}</b>`;
}
const rowHTML = m => `<li><button class="row" data-id="${m.i}">
    ${tile(m)}
    <span class="nm"><span class="no">#${num(m)}</span>${esc(m.n)}${marks(m)}</span>
    <span class="tys">${m.t.map(t => badge(t)).join('')}</span>
    <span class="ev">${hint(m)}</span></button></li>`;

function dexOrder() {
  return state.dex === 'unova' ? M.filter(m => m.u !== undefined).sort((a, b) => a.u - b.u) : M;
}
/* every word must match: a type, the number, the name, an ability, or how it evolves next ("lv 17", "stone", "trade") */
function matches(m, q) {
  const lv = /^(?:lv|lvl|level)\.?\s*(\d+)$/.exec(q);
  const next = (kids.get(m.i) || []).map(c => c.m.map(x => x[0]).join(' ')).join(' ').toLowerCase();
  if (lv) return new RegExp('\\blv ' + lv[1] + '\\b').test(next);
  return q.split(/\s+/).every(w => {
    const n = w.replace(/^#?0*(?=\d)/, '');
    if (/^\d+$/.test(n)) return String(m.i) === n || (state.dex === 'unova' && String(m.u) === n);
    return m.n.toLowerCase().includes(w) || m.t.some(t => T[t].toLowerCase() === w) ||
      m.a.some(a => DATA.abil[a[0]].toLowerCase().includes(w)) || next.includes(w);
  });
}
function renderList() {
  const q = state.q.trim().toLowerCase();
  const all = dexOrder();
  const rows = all.filter(m =>
    (state.type < 0 || m.t.includes(state.type)) && (!state.onlyNew || !caught.has(m.i)) && (!q || matches(m, q)));
  $('count').textContent = `${rows.length} Pokémon · ${all.filter(m => caught.has(m.i)).length} of ${all.length} caught · yellow tag = next evolution`;
  $('list').innerHTML = rows.length ? rows.map(rowHTML).join('')
    : '<li class="empty">No Pokémon match. Try “All 649”, or clear the type and Uncaught filters.</li>';
}

function defMult(ts) { return T.map((_, a) => ts.reduce((p, d) => p * C[a][d] / 100, 1)); }
function effRows(groups) {
  return groups.map(([label, cls, list]) =>
    `<div class="mult ${cls}">${label}</div><div class="tys">${list.length ? list.map(t => badge(t)).join('') : '<span class="none">none</span>'}</div>`).join('');
}
function defBlock(ts) {
  const m = defMult(ts), pick = v => m.map((x, i) => x === v ? i : -1).filter(i => i >= 0);
  const g = [];
  if (pick(4).length) g.push(['×4', 'g', pick(4)]);
  g.push(['×2', 'g', pick(2)]);
  g.push(['×½', 'b', pick(0.5)]);
  if (pick(0.25).length) g.push(['×¼', 'b', pick(0.25)]);
  if (pick(0).length) g.push(['×0', 'z', pick(0)]);
  return effRows(g);
}
function atkBlock(t) {
  const pick = v => C[t].map((x, i) => x === v ? i : -1).filter(i => i >= 0);
  const g = [['×2', 'g', pick(200)], ['×½', 'b', pick(50)]];
  if (pick(0).length) g.push(['×0', 'z', pick(0)]);
  return effRows(g);
}

const monBtn = (m, me) => `<button class="mon${m.i === me ? ' me' : ''}" data-id="${m.i}">${pic(m)}${esc(m.n)}${caught.has(m.i) ? ' <span class="got">✔</span>' : ''}</button>`;
const lvText = (lo, hi) => lo === hi ? 'Lv ' + lo : `Lv ${lo}–${hi}`;
const rateText = (r0, r1) => r1 ? `<b>${r0 === r1 ? r1 : r0 + '–' + r1}%</b>` : '';
const seasonText = mask => mask !== 15 ? SEASON.filter((_, i) => mask >> i & 1).join(', ') + ' only' : '';

function locLine(e) {
  const [li, mi, lo, hi, r0, r1, mask, note] = e;
  const extra = [METH[mi], note, seasonText(mask)].filter(Boolean).join(' · ');
  return `<div class="loc"><button class="pl" data-loc="${li}">${esc(LOCS[li])}</button><div class="how">${esc(extra)}</div><div class="rt">${lvText(lo, hi)} ${rateText(r0, r1)}</div></div>`;
}
function locBlock(m) {
  if (m.e) {
    const LIMIT = 6, list = state.allLocs ? m.e : m.e.slice(0, LIMIT);
    return `<div class="locs">${list.map(locLine).join('')}</div>` +
      (m.e.length > LIMIT ? `<button class="btn flat wide" id="more-locs">${state.allLocs ? 'Show fewer ▲' : `Show ${m.e.length - LIMIT} more places ▼`}</button>` : '');
  }
  const fam = M.filter(x => x.c === m.c && x.i !== m.i);
  const src = fam.filter(x => x.e);
  if (src.length) {
    const isAncestor = x => { for (let p = m; p && p.f; p = byId.get(p.f)) if (p.f === x.i) return true; return false; };
    return `<p class="warn">${esc(m.n)} is not found in the wild in White. Catch a relative and ${src.some(isAncestor) ? 'evolve it' : 'breed it'}:</p>
      <div class="locs">${src.map(x => `<div class="loc"><div class="pl plain">${monBtn(x, m.i)}</div><div class="how">${esc(LOCS[x.e[0][0]])} · ${METH[x.e[0][1]]}</div><div class="rt">${lvText(x.e[0][2], x.e[0][3])}</div></div>`).join('')}</div>`;
  }
  if (m.bo || fam.some(x => x.bo))
    return `<p class="warn">Black version only. To get one in White you need to trade with a Black player.</p>`;
  return `<p class="warn">Not obtainable in White's own story. It has to come from an older game (Poké Transfer), an event, or a trade.</p>`;
}

function moveLine(label, idx, m) {
  const [name, ty, cls, pw, acc, pp] = MOVES[idx];
  const stab = cls > 1 && m.t.includes(ty) ? ' · <b>STAB</b>' : '';
  const nums = cls > 1 ? ` · Pwr ${pw > 1 ? pw : '—'}` : '';
  return `<div class="mv"><span class="lv">${label}</span><span class="mn">${esc(name)}</span>${badge(ty)}<span class="ms">${CLASS[cls]}${nums} · Acc ${acc || '—'} · PP ${pp}${stab}</span></div>`;
}
function tmList(m) {
  const bits = BigInt('0x' + (m.tm || '0'));
  return TMS.filter((_, i) => bits >> BigInt(i) & 1n);
}
function moveBlock(m) {
  const tms = tmList(m);
  return `<div class="sub">Learned by level</div>
    <div>${m.lm.length ? m.lm.map(([lv, i]) => moveLine(lv > 1 ? 'Lv ' + lv : 'Start', i, m)).join('') : '<p class="note">No level-up moves.</p>'}</div>
    <div class="sub">TMs and HMs it can use · ${tms.length}</div>
    ${tms.length ? (state.allTms ? `<div>${tms.map(([lb, i]) => moveLine(lb, i, m)).join('')}</div>` : '') +
      `<button class="btn flat wide" id="more-tms">${state.allTms ? 'Hide TM list ▲' : `Show ${tms.length} TMs and HMs ▼`}</button>` : '<p class="note">Cannot use any TM or HM.</p>'}`;
}

function facts(m) {
  const inches = Math.round(m.ht * 3.937), lbs = (m.wt * 0.220462).toFixed(1);
  const gender = m.gr < 0 ? 'Genderless' : m.gr === 0 ? '100% ♂' : m.gr === 8 ? '100% ♀' : `${100 - m.gr * 12.5}% ♂ · ${m.gr * 12.5}% ♀`;
  const abil = m.a.map(([a, h]) => esc(DATA.abil[a]) + (h ? ' <small>(hidden, Dream World)</small>' : '')).join('<br>');
  const rows = [
    ['Species', esc(m.ge)],
    ['Height', `${Math.floor(inches / 12)}′${String(inches % 12).padStart(2, '0')}″ <small>(${(m.ht / 10).toFixed(1)} m)</small>`],
    ['Weight', `${lbs} lbs <small>(${(m.wt / 10).toFixed(1)} kg)</small>`],
    ['Abilities', abil || '—'],
    ['Gender', gender],
    ['Catch rate', `${m.cr} <small>(of 255, higher is easier)</small>`],
    ['Egg groups', m.eg.map(i => DATA.egg[i]).join(', ')],
    ['Growth', DATA.growth[m.gw]],

    ['EV yield', m.ev.map(([s, v]) => `${v} ${STAT[s]}`).join(', ') || '—'],

function bossBox([group, name, where, note, ty, team]) {

  const mine = [...party].map(i => byId.get(i)).filter(Boolean)
    .map(p => [p, mons.filter(([m]) => p.t.some(a => defMult(m.t)[a] >= 2)).length]).filter(x => x[1]).sort((x, y) => y[1] - x[1]);
  return `<section class="box"><h2><span class="ico">▶</span>${esc(name)}${ty >= 0 ? `<span class="end">${badge(ty)}</span>` : ''}</h2>
    <p class="note">${esc(where)}${note ? ' · ' + esc(note) : ''}</p>
    <div class="squad">${mons.map(([m, lv]) => `<div class="m">${monBtn(m, 0)}<span class="r"><span class="l">Lv ${lv}</span>${m.t.map(t => badge(t)).join('')}</span></div>`).join('')}</div>
    <div class="sub">Best move types to bring</div>
    <div class="tips">${hits.map(([a, n]) => `<span class="t">${badge(a)}hits ${n} of ${mons.length}</span>`).join('')}</div>
    ${party.size ? `<div class="sub">From your team</div><div class="tips">${mine.length ? mine.map(([p, n]) => `<span class="t">${esc(p.n)} · ${n} of ${mons.length}</span>`).join('') : '<span class="t" style="color:var(--mute)">Nobody has a type advantage yet.</span>'}</div>` : ''}
  </section>`;
}

  $('atk-out').innerHTML = `<div class="lbl">${T[state.atk]} moves against:</div>` + atkBlock(state.atk);
  $('def-pick').innerHTML = T.map((_, t) => badge(t, 'button', ` data-t="${t}" aria-pressed="${state.def.includes(t)}"`)).join('');
  $('def-out').innerHTML = state.def.length
    ? `<div class="lbl">A ${state.def.map(t => T[t]).join(' / ')} opponent takes, by move type:</div>` + defBlock(state.def)
    : '<div class="lbl">Pick at least one type above.</div>';
}
function renderMatrix() {
  const ab = t => T[t].slice(0, 3).toUpperCase(), cls = t => WHITE.has(t) ? ' class="w"' : '';
  $('mx').innerHTML = `<thead><tr><th class="corner">ATK\\DEF</th>${T.map((_, d) => `<th${cls(d)} style="background:${COL[d]}"><span>${ab(d)}</span></th>`).join('')}</tr></thead><tbody>` +
    T.map((_, a) => `<tr><th${cls(a)} style="background:${COL[a]}">${ab(a)}</th>${C[a].map(v =>
      v === 200 ? '<td class="g">2</td>' : v === 50 ? '<td class="b">½</td>' : v === 0 ? '<td class="z">0</td>' : '<td></td>').join('')}</tr>`).join('') + '</tbody>';
}

/* ---- routing: '', pN, types, places, lN, bosses, team, more ---- */
const VIEWS = ['list', 'detail', 'types', 'places', 'place', 'bosses', 'team', 'more'];
const scrolls = {};
let currentHash = '', currentView = 'list';
function route() {
  const h = location.hash.replace('#', '');
  const pm = /^p(\d+)$/.exec(h), lm = /^l(\d+)$/.exec(h);
  const view = pm && byId.has(+pm[1]) ? 'detail' : lm && LOCS[+lm[1]] ? 'place' : VIEWS.includes(h) && h !== 'list' && h !== 'detail' && h !== 'place' ? h : 'list';
  scrolls[currentHash] = window.scrollY;
  if (view !== 'detail') lastList = view === 'list' ? '' : h;
  VIEWS.forEach(v => { $('view-' + v).hidden = v !== view; });
  const root = view === 'detail' ? (/^l\d+$/.test(lastList) ? 'places' : lastList || 'dex') : view === 'place' ? 'places' : view === 'list' ? 'dex' : view;
  ['dex', 'types', 'places', 'bosses', 'team'].forEach(t => $('tab-' + t).setAttribute('aria-selected', t === root));
  $('open-more').setAttribute('aria-pressed', view === 'more');
  const cameBack = currentView === 'detail' || (currentView === 'place' && view === 'places');
  if (view === 'detail') { state.allLocs = state.allTms = false; renderDetail(byId.get(+pm[1])); }
  else if (view === 'place') renderPlace(+lm[1]);
  else ({ list: renderList, types: renderTypes, places: renderPlaces, bosses: renderBosses, team: renderTeam, more: renderMore })[view]();
  window.scrollTo(0, cameBack && view !== 'detail' ? scrolls[h] || 0 : 0);
  currentHash = h; currentView = view;
}
const go = h => { if (location.hash.replace('#', '') === h) route(); else location.hash = h; };
/* any element with data-id opens that Pokémon, data-loc that place */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-id]'); if (a) return go('p' + a.dataset.id);
  const l = e.target.closest('[data-loc]'); if (l) return go('l' + l.dataset.loc);
});

$('typebar').innerHTML = T.map((_, t) => badge(t, 'button', ` data-t="${t}" aria-pressed="false"`)).join('');
function syncFilters() {
  $('dex-unova').setAttribute('aria-pressed', state.dex === 'unova');
  $('dex-nat').setAttribute('aria-pressed', state.dex === 'nat');
  $('only-new').setAttribute('aria-pressed', state.onlyNew);
  $('typebar').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.t === state.type)));
  $('type-toggle').textContent = state.type < 0 ? 'Type ▾' : `${T[state.type]} ✕`;
  store('dex', state.dex);
  renderList();
}
const showTypes = on => { $('typebar').hidden = !on; $('type-toggle').setAttribute('aria-expanded', on); };
try { if (localStorage.getItem('dex') === 'nat') state.dex = 'nat'; } catch (e) {}

const setQuery = q => { state.q = q; $('q-clear').hidden = !q; renderList(); };
$('q').addEventListener('input', e => setQuery(e.target.value));
$('q-clear').onclick = () => { $('q').value = ''; setQuery(''); $('q').focus(); };
$('dex-unova').onclick = () => { state.dex = 'unova'; syncFilters(); };
$('dex-nat').onclick = () => { state.dex = 'nat'; syncFilters(); };
$('only-new').onclick = () => { state.onlyNew = !state.onlyNew; syncFilters(); };
$('type-toggle').onclick = () => {
  if (state.type >= 0) { state.type = -1; showTypes(false); syncFilters(); }
  else showTypes($('typebar').hidden);
};
$('typebar').onclick = e => { const b = e.target.closest('button'); if (!b) return; state.type = +b.dataset.t; showTypes(false); syncFilters(); window.scrollTo(0, 0); };
$('tab-dex').onclick = () => go('');
['types', 'places', 'bosses', 'team'].forEach(t => { $('tab-' + t).onclick = () => go(t); });
$('open-more').onclick = () => go(currentView === 'more' ? '' : 'more');
$('view-team').addEventListener('click', e => { if (e.target.closest('#team-go')) go(''); });
$('view-place').addEventListener('click', e => { if (e.target.closest('#back-places')) go('places'); });
const smooth = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
$('view-detail').addEventListener('click', e => {
  if (e.target.closest('#back')) return go(lastList);
  const id = +location.hash.slice(2);
  const j = e.target.closest('[data-go]');
  if (j) return $(j.dataset.go).scrollIntoView({ behavior: smooth(), block: 'start' });
  const again = () => { const y = window.scrollY; renderDetail(byId.get(id)); window.scrollTo(0, y); };
  if (e.target.closest('#more-locs')) { state.allLocs = !state.allLocs; again(); }
  else if (e.target.closest('#more-tms')) { state.allTms = !state.allTms; again(); }
  else if (e.target.closest('#party-btn')) { party.has(id) ? party.delete(id) : party.add(id); saveParty(); again(); }
  else if (e.target.closest('#caught-btn')) { caught.has(id) ? caught.delete(id) : caught.add(id); saveCaught(); again(); }
});
$('view-more').addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]');
  if (z) { zoom = +z.dataset.zoom; store('zoom', String(zoom)); applyZoom(); return renderMore(); }
  if (e.target.closest('#code-copy')) {
    const box = $('code-out'), done = t => { $('opt-msg').textContent = t; };
    const fallback = () => { box.focus(); box.select(); done('Code selected. Use Copy from the menu.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(() => done('Backup code copied.'), fallback);
    else fallback();
  }
  if (e.target.closest('#code-load')) {
    try {
      const d = readCode($('code-in').value);
      party = new Set(d.t); caught = new Set(d.c); saveParty(); saveCaught();
      optMsg = `Restored ${d.t.length} team members and ${d.c.length} caught Pokémon.`;
      renderMore();
    } catch (err) { $('opt-msg').textContent = 'That code is not valid. Paste the whole code, starting with PDX1.'; }
  }
});
$('atk-pick').onclick = e => { const b = e.target.closest('button'); if (b) { state.atk = +b.dataset.t; renderTypes(); } };
$('def-pick').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = +b.dataset.t, i = state.def.indexOf(t);
  if (i >= 0) state.def.splice(i, 1); else { state.def.push(t); if (state.def.length > 2) state.def.shift(); }
  renderTypes();
};
window.addEventListener('hashchange', route);
$('team-n').textContent = party.size;
applyZoom(); renderMatrix(); syncFilters(); route();
</script>
