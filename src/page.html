<title>Pokédex White</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/*STYLE*/
</style>

<header class="top">
  <div class="wrap">
    <div class="lens"></div><h1>POKéDEX</h1>
    <div class="dots"><i style="background:#e9483a"></i><i style="background:#ffd84a"></i><i style="background:#4bc56d"></i></div>
    <button class="topbtn" id="open-more" aria-pressed="false">Options</button>
  </div>
</header>

<div class="wrap">
  <main id="view-list">
    <div class="tools">
      <div class="seg">
        <button class="chip" id="dex-unova" aria-pressed="true">Unova</button>
        <button class="chip" id="dex-nat" aria-pressed="false">All 649</button>
        <button class="chip" id="only-new" aria-pressed="false">Uncaught</button>
        <button class="chip push" id="type-toggle" aria-expanded="false" aria-controls="typebar">Type ▾</button>
      </div>
    </div>
    <div class="typebar" id="typebar" aria-label="Filter by type" hidden></div>
    <div class="count" id="count"></div>
    <ul class="list" id="list"></ul>
  </main>
  <main id="view-detail" hidden></main>
  <main id="view-places" hidden></main>
  <main id="view-place" hidden></main>
  <main id="view-bosses" hidden></main>
  <main id="view-team" hidden></main>
  <main id="view-more" hidden></main>
  <main id="view-dock" hidden></main>
  <main id="view-types" hidden>
    <section class="box">
      <h2><span class="ico">▶</span>My move is type…</h2>
      <p class="note">Pick a move's type to see what it hits hard.</p>
      <div class="picker" id="atk-pick"></div>
      <div class="eff" id="atk-out"></div>
    </section>
    <section class="box">
      <h2><span class="ico">▶</span>The opponent is type…</h2>
      <p class="note">Pick the opponent's one or two types to see which moves to use.</p>
      <div class="picker" id="def-pick"></div>
      <div class="eff" id="def-out"></div>
    </section>
    <section class="box">
      <h2><span class="ico">▶</span>Gen V type chart</h2>
      <p class="note">Rows attack, columns defend. 2 = double, ½ = half, 0 = no effect.</p>
      <div class="scroll"><table class="mx" id="mx"></table></div>
    </section>
  </main>
</div>

<div class="bottom" id="bottom">
  <div class="wrap">
    <div class="results" id="results" hidden></div>
    <div class="searchbar">
      <span class="mag" aria-hidden="true"></span>
      <input id="q" type="search" placeholder="Search name, number, type, “lv 17”" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search Pokémon by name, number, type, ability or evolution level">
      <button id="q-clear" aria-label="Clear search" hidden>✕</button>
    </div>
    <nav class="tabs" aria-label="Sections" role="tablist">
      <button id="tab-dex" role="tab" aria-selected="true">Dex</button>
      <button id="tab-types" role="tab" aria-selected="false">Types</button>
      <button id="tab-places" role="tab" aria-selected="false">Places</button>
      <button id="tab-bosses" role="tab" aria-selected="false">Bosses</button>
      <button id="tab-team" role="tab" aria-selected="false">Team<span class="n" id="team-n">0</span></button>
    </nav>
  </div>
</div>

<script>
const DATA = /*DATA*/;
const T = DATA.types, C = DATA.chart, M = DATA.mons, LOCS = DATA.locs, MOVES = DATA.moves, TMS = DATA.tms;
const COL = ['#a8a878','#c03028','#a890f0','#a040a0','#e0c068','#b8a038','#a8b820','#705898','#b8b8d0','#f08030','#6890f0','#78c850','#f8d030','#f85888','#98d8d8','#7038f8','#705848'];
const WHITE = new Set([1,3,7,15,16]);
const STAT = ['HP','Attack','Defense','Sp. Atk','Sp. Def','Speed'];
/* same order as DATA.meths */
const METH = ['Tall grass / cave floor','Dark grass (double battles)','Rustling grass','Dust cloud in cave','Shadow on bridge','Surfing','Rippling water (Surf)','Fishing (Super Rod)','Fishing in rippling water','Gift','Gift egg','Fixed encounter (once)'];
const SEASON = ['Spring','Summer','Autumn','Winter'];
const CLASS = ['', 'Status', 'Physical', 'Special'];
const byId = new Map(M.map(m => [m.i, m]));
const kids = new Map();
M.forEach(m => { if (m.f) { if (!kids.has(m.f)) kids.set(m.f, []); kids.get(m.f).push(m); } });
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(3, '0');

/* saved on this device only */
const load = k => { try { return new Set(JSON.parse(localStorage.getItem(k) || '[]')); } catch (e) { return new Set(); } };
const store = (k, v) => { try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify([...v])); } catch (e) {} };
let party = load('party'), caught = load('caught');
const saveParty = () => { store('party', party); $('team-n').textContent = party.size; };
const saveCaught = () => store('caught', caught);

const qEl = $('q'), resultsEl = $('results'), bottomEl = $('bottom');
const state = { dex: 'unova', q: '', type: -1, onlyNew: false, atk: 9, def: [11], allLocs: false, allTms: false };

/*SPRITES*/
/* Pictures are the Black/White sprites, loaded from the PokeAPI sprite host and never copied into this app.
   An empty SPRITE_URL (the claude.ai build, where outside images are blocked) uses the drawn mascots only. */
const SPRITE_URL = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/';
const pic = (m, attrs = '') => SPRITE_URL
  ? `<img ${attrs} src="${SPRITE_URL}${m.i}.png" data-mon="${m.i}" crossorigin="anonymous" loading="lazy" alt="">`
  : `<img ${attrs} src="${sprite(m)}" data-fb="1" alt="">`;
const tile = m => `<span class="disc" style="--tint:${mix(COL[m.t[0]], 255, .6)}">${pic(m, 'class="tile"')}</span>`;
/* a sprite that fails to load (offline and never seen, or the host is down) is replaced by the drawn mascot */
document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName !== 'IMG' || !img.dataset.mon || img.dataset.fb) return;
  img.dataset.fb = '1';
  img.removeAttribute('crossorigin');
  img.src = sprite(byId.get(+img.dataset.mon));
}, true);
const badge = (t, tag = 'span', extra = '') =>
  `<${tag} class="ty${WHITE.has(t) ? ' w' : ''}" style="background:${COL[t]}"${extra}>${T[t]}</${tag}>`;
const num = m => state.dex === 'unova' && m.u !== undefined ? pad(m.u) : pad(m.i);
const marks = m => (party.has(m.i) ? ' <span class="star">★</span>' : '') + (caught.has(m.i) ? ' <span class="got">✔</span>' : '');

function hint(m) {
  const k = kids.get(m.i);
  if (!k) return '<i>—</i>';
  if (k.length > 1) return `<b>${k.length} paths</b>`;
  return `<b>${esc(k[0].m[0][0])}</b>`;
}
const rowHTML = m => `<li><button class="row" data-id="${m.i}">
    ${tile(m)}
    <span class="nm"><span class="no">#${num(m)}</span>${esc(m.n)}${marks(m)}</span>
    <span class="tys">${m.t.map(t => badge(t)).join('')}</span>
    <span class="ev">${hint(m)}</span></button></li>`;

function dexOrder() {
  return state.dex === 'unova' ? M.filter(m => m.u !== undefined).sort((a, b) => a.u - b.u) : M;
}
/* every word must match: a type, the number, the name, an ability, or how it evolves next ("lv 17", "stone", "trade") */
function matches(m, q) {
  const lv = /^(?:lv|lvl|level)\.?\s*(\d+)$/.exec(q);
  const next = (kids.get(m.i) || []).map(c => c.m.map(x => x[0]).join(' ')).join(' ').toLowerCase();
  if (lv) return new RegExp('\\blv ' + lv[1] + '\\b').test(next);
  return q.split(/\s+/).every(w => {
    const n = w.replace(/^#?0*(?=\d)/, '');
    if (/^\d+$/.test(n)) return String(m.i) === n || (state.dex === 'unova' && String(m.u) === n);
    return m.n.toLowerCase().includes(w) || m.t.some(t => T[t].toLowerCase() === w) ||
      m.a.some(a => DATA.abil[a[0]].toLowerCase().includes(w)) || next.includes(w);
  });
}
function renderList() {
  const all = dexOrder();
  const rows = all.filter(m => (state.type < 0 || m.t.includes(state.type)) && (!state.onlyNew || !caught.has(m.i)));
  $('count').textContent = `${rows.length} Pokémon · ${all.filter(m => caught.has(m.i)).length} of ${all.length} caught · yellow tag = next evolution`;
  $('list').innerHTML = rows.length ? rows.map(rowHTML).join('')
    : '<li class="empty">No Pokémon match. Try “All 649”, or clear the type and Uncaught filters.</li>';
}

function defMult(ts) { return T.map((_, a) => ts.reduce((p, d) => p * C[a][d] / 100, 1)); }
function effRows(groups) {
  return groups.map(([label, cls, list]) =>
    `<div class="mult ${cls}">${label}</div><div class="tys">${list.length ? list.map(t => badge(t)).join('') : '<span class="none">none</span>'}</div>`).join('');
}
function defBlock(ts) {
  const m = defMult(ts), pick = v => m.map((x, i) => x === v ? i : -1).filter(i => i >= 0);
  const g = [];
  if (pick(4).length) g.push(['×4', 'g', pick(4)]);
  g.push(['×2', 'g', pick(2)]);
  g.push(['×½', 'b', pick(0.5)]);
  if (pick(0.25).length) g.push(['×¼', 'b', pick(0.25)]);
  if (pick(0).length) g.push(['×0', 'z', pick(0)]);
  return effRows(g);
}
function atkBlock(t) {
  const pick = v => C[t].map((x, i) => x === v ? i : -1).filter(i => i >= 0);
  const g = [['×2', 'g', pick(200)], ['×½', 'b', pick(50)]];
  if (pick(0).length) g.push(['×0', 'z', pick(0)]);
  return effRows(g);
}

const monBtn = (m, me) => `<button class="mon${m.i === me ? ' me' : ''}" data-id="${m.i}">${pic(m)}${esc(m.n)}${caught.has(m.i) ? ' <span class="got">✔</span>' : ''}</button>`;
const lvText = (lo, hi) => lo === hi ? 'Lv ' + lo : `Lv ${lo}–${hi}`;
const rateText = (r0, r1) => r1 ? `<b>${r0 === r1 ? r1 : r0 + '–' + r1}%</b>` : '';
const seasonText = mask => mask !== 15 ? SEASON.filter((_, i) => mask >> i & 1).join(', ') + ' only' : '';

function locLine(e) {
  const [li, mi, lo, hi, r0, r1, mask, note] = e;
  const extra = [METH[mi], note, seasonText(mask)].filter(Boolean).join(' · ');
  return `<div class="loc"><button class="pl" data-loc="${li}">${esc(LOCS[li])}</button><div class="how">${esc(extra)}</div><div class="rt">${lvText(lo, hi)} ${rateText(r0, r1)}</div></div>`;
}
function locBlock(m) {
  if (m.e) {
    const LIMIT = 6, list = state.allLocs ? m.e : m.e.slice(0, LIMIT);
    return `<div class="locs">${list.map(locLine).join('')}</div>` +
      (m.e.length > LIMIT ? `<button class="btn flat wide" id="more-locs">${state.allLocs ? 'Show fewer ▲' : `Show ${m.e.length - LIMIT} more places ▼`}</button>` : '');
  }
  const fam = M.filter(x => x.c === m.c && x.i !== m.i);
  const src = fam.filter(x => x.e);
  if (src.length) {
    const isAncestor = x => { for (let p = m; p && p.f; p = byId.get(p.f)) if (p.f === x.i) return true; return false; };
    return `<p class="warn">${esc(m.n)} is not found in the wild in White. Catch a relative and ${src.some(isAncestor) ? 'evolve it' : 'breed it'}:</p>
      <div class="locs">${src.map(x => `<div class="loc"><div class="pl plain">${monBtn(x, m.i)}</div><div class="how">${esc(LOCS[x.e[0][0]])} · ${METH[x.e[0][1]]}</div><div class="rt">${lvText(x.e[0][2], x.e[0][3])}</div></div>`).join('')}</div>`;
  }
  if (m.bo || fam.some(x => x.bo))
    return `<p class="warn">Black version only. To get one in White you need to trade with a Black player.</p>`;
  return `<p class="warn">Not obtainable in White's own story. It has to come from an older game (Poké Transfer), an event, or a trade.</p>`;
}

function moveLine(label, idx, m) {
  const [name, ty, cls, pw, acc, pp] = MOVES[idx];
  const stab = cls > 1 && m.t.includes(ty) ? ' · <b>STAB</b>' : '';
  const nums = cls > 1 ? ` · Pwr ${pw > 1 ? pw : '—'}` : '';
  return `<div class="mv"><span class="lv">${label}</span><span class="mn">${esc(name)}</span>${badge(ty)}<span class="ms">${CLASS[cls]}${nums} · Acc ${acc || '—'} · PP ${pp}${stab}</span></div>`;
}
function tmList(m) {
  const bits = BigInt('0x' + (m.tm || '0'));
  return TMS.filter((_, i) => bits >> BigInt(i) & 1n);
}
function moveBlock(m) {
  const tms = tmList(m);
  return `<div class="sub">Learned by level</div>
    <div>${m.lm.length ? m.lm.map(([lv, i]) => moveLine(lv > 1 ? 'Lv ' + lv : 'Start', i, m)).join('') : '<p class="note">No level-up moves.</p>'}</div>
    <div class="sub">TMs and HMs it can use · ${tms.length}</div>
    ${tms.length ? (state.allTms ? `<div>${tms.map(([lb, i]) => moveLine(lb, i, m)).join('')}</div>` : '') +
      `<button class="btn flat wide" id="more-tms">${state.allTms ? 'Hide TM list ▲' : `Show ${tms.length} TMs and HMs ▼`}</button>` : '<p class="note">Cannot use any TM or HM.</p>'}`;
}

function facts(m) {
  const inches = Math.round(m.ht * 3.937), lbs = (m.wt * 0.220462).toFixed(1);
  const gender = m.gr < 0 ? 'Genderless' : m.gr === 0 ? '100% ♂' : m.gr === 8 ? '100% ♀' : `${100 - m.gr * 12.5}% ♂ · ${m.gr * 12.5}% ♀`;
  const abil = m.a.map(([a, h]) => esc(DATA.abil[a]) + (h ? ' <small>(hidden, Dream World)</small>' : '')).join('<br>');
  const rows = [
    ['Species', esc(m.ge)],
    ['Height', `${Math.floor(inches / 12)}′${String(inches % 12).padStart(2, '0')}″ <small>(${(m.ht / 10).toFixed(1)} m)</small>`],
    ['Weight', `${lbs} lbs <small>(${(m.wt / 10).toFixed(1)} kg)</small>`],
    ['Abilities', abil || '—'],
    ['Gender', gender],
    ['Catch rate', `${m.cr} <small>(of 255, higher is easier)</small>`],
    ['Egg groups', m.eg.map(i => DATA.egg[i]).join(', ')],
    ['Growth', DATA.growth[m.gw]],
    ['Base Exp', m.bx],
    ['EV yield', m.ev.map(([s, v]) => `${v} ${STAT[s]}`).join(', ') || '—'],
  ];
  return `<dl class="facts">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

const sizeText = m => {
  const inches = Math.round(m.ht * 3.937);
  return { ft: `${Math.floor(inches / 12)}′${String(inches % 12).padStart(2, '0')}″`, m: (m.ht / 10).toFixed(1), lbs: (m.wt * 0.220462).toFixed(1), kg: (m.wt / 10).toFixed(1) };
};
/* The whole family as cards. A straight line of up to three sits in one row; anything that branches stacks by stage. */
function evoBlock(m) {
  const fam = M.filter(x => x.c === m.c);
  if (fam.length < 2) return '<p class="note">This Pokémon does not evolve.</p>';
  const depth = x => x.f && byId.has(x.f) ? depth(byId.get(x.f)) + 1 : 0;
  const stages = [];
  fam.forEach(x => { const d = depth(x); (stages[d] = stages[d] || []).push(x); });
  const card = x => `<div class="step"><b class="cond">${x.f ? esc(x.m.map(c => c[0]).join(' / ')) : ''}</b>
    <button class="pcard${x.i === m.i ? ' me' : ''}" data-id="${x.i}" style="--frame:${COL[x.t[0]]}"><span class="bar"><span>No.${String(x.i).padStart(4, '0')}</span><i></i></span><span class="nm">${esc(x.n)}</span>${tile(x)}</button></div>`;
  const linear = stages.length <= 3 && stages.every(st => st.length === 1);
  const cards = linear
    ? `<div class="evo${stages.length === 2 ? ' big' : ''}">${stages.map(st => card(st[0])).join('<span class="arrow">▶</span>')}</div>`
    : `<div class="evo tall">${stages.map(st => `<div class="stagerow">${st.map(card).join('')}</div>`).join('<span class="arrow">▼</span>')}</div>`;
  const lines = fam.filter(x => x.f).sort((a, b) => depth(a) - depth(b) || a.i - b.i)
    .map(x => `<li><b>${esc(byId.get(x.f).n)} → ${esc(x.n)}:</b> ${x.m.map(c => esc(c[1])).join(' — or — ')}</li>`);
  return cards + `<ul class="evolist">${lines.join('')}</ul>`;
}

let lastList = '';
function renderDetail(m) {
  const total = m.s.reduce((a, b) => a + b, 0), size = sizeText(m);
  let order = dexOrder(), at = order.indexOf(m);
  if (at < 0) { order = M; at = order.indexOf(m); }
  const prev = order[at - 1], nxt = order[at + 1];
  $('view-detail').innerHTML = `
    <div class="dnav"><button class="btn grow" id="back">◀ Back</button></div>
    <section class="box hero" style="--frame:${COL[m.t[0]]}">
      <div class="no">No.${String(m.i).padStart(4, '0')}${m.u !== undefined ? ' · UNOVA ' + pad(m.u) : ''}</div>
      <h2>${esc(m.n)}</h2>
      <div class="ge">${esc(m.ge)}</div>
      <div class="stage">
        <button class="round" ${prev ? `data-id="${prev.i}"` : 'disabled'} aria-label="Previous Pokémon${prev ? ': ' + esc(prev.n) : ''}">‹</button>
        ${tile(m)}
        <button class="round" ${nxt ? `data-id="${nxt.i}"` : 'disabled'} aria-label="Next Pokémon${nxt ? ': ' + esc(nxt.n) : ''}">›</button>
      </div>
      <div class="tys">${m.t.map(t => badge(t)).join('')}</div>
      <div class="cells">
        <div class="cell"><small>Height</small><b>${size.ft}</b><i>${size.m} m</i></div>
        <div class="cell"><small>Weight</small><b>${size.lbs} lbs</b><i>${size.kg} kg</i></div>
        <div class="cell"><small>Gender</small>${m.gr < 0 ? '<b>—</b><i>Genderless</i>' : `<b>♂ ${100 - m.gr * 12.5}%</b><i>♀ ${m.gr * 12.5}%</i>`}</div>
      </div>
      <div class="fact"><small>Abilities</small>${m.a.map(([a, h]) => h ? `<span>${esc(DATA.abil[a])} (hidden)</span>` : `<b>${esc(DATA.abil[a])}</b>`).join(' · ') || '—'}</div>
      <div class="acts">
        <button class="btn flat" id="party-btn" aria-pressed="${party.has(m.i)}">${party.has(m.i) ? '★ In team' : '☆ Team'}</button>
        <button class="btn flat" id="caught-btn" aria-pressed="${caught.has(m.i)}">${caught.has(m.i) ? '✔ Caught' : '○ Caught'}</button>
        <a class="btn flat" href="https://pokemondb.net/sprites/${m.g}" target="_blank" rel="noopener">Sprites ↗</a>
      </div>
    </section>
    <nav class="jump" aria-label="Jump to section">
      <button class="chip" data-go="s-atk">Types</button>
      <button class="chip" data-go="s-evo">Evolve</button>
      <button class="chip" data-go="s-loc">Catch</button>
      <button class="chip" data-go="s-mov">Moves</button>
      <button class="chip" data-go="s-data">Data</button>
    </nav>
    <section class="box" id="s-atk">
      <h2><span class="ico">▶</span>Attacking</h2>
      <p class="note">What ${esc(m.n)}'s own-type moves hit hard. Own-type moves also get ×1.5 damage (STAB).</p>
      ${m.t.map(t => `<div class="sub">${badge(t)} moves</div><div class="eff">${atkBlock(t)}</div>`).join('')}
    </section>
    <section class="box" id="s-def">
      <h2><span class="ico">▶</span>Defending</h2>
      <p class="note">Damage ${esc(m.n)} takes, by the type of the incoming move.</p>
      <div class="eff">${defBlock(m.t)}</div>
    </section>
    <section class="box" id="s-evo">
      <h2><span class="ico">▶</span>Evolution</h2>
      ${evoBlock(m)}
    </section>
    <section class="box" id="s-loc">
      <h2><span class="ico">▶</span>Where to catch in White</h2>
      ${locBlock(m)}
      <p class="note" style="margin-top:10px">% is the encounter rate for that method. Tap a place to see everything found there. Swarms are not listed.</p>
    </section>
    <section class="box" id="s-mov">
      <h2><span class="ico">▶</span>Moves in Black/White</h2>
      ${moveBlock(m)}
    </section>
    <section class="box" id="s-data">
      <h2><span class="ico">▶</span>Pokédex data</h2>
      ${facts(m)}
    </section>
    <section class="box">
      <h2><span class="ico">▶</span>Base stats · total ${total}</h2>
      <div class="stats">${m.s.map((v, i) => `<span>${STAT[i]}</span><span class="v">${v}</span><span class="bar"><i style="width:${Math.min(100, v / 2)}%"></i></span>`).join('')}</div>
    </section>`;
}

/* ---- places ---- */
const atPlace = new Map();
M.forEach(m => (m.e || []).forEach(e => { if (!atPlace.has(e[0])) atPlace.set(e[0], []); atPlace.get(e[0]).push([m, e]); }));
const speciesAt = li => new Set((atPlace.get(li) || []).map(x => x[0].i));
function renderPlaces() {
  $('view-places').innerHTML = `<p class="note">Pick a place to see every Pokémon found there in White, and which ones you still need.</p>
    <ul class="list">${LOCS.map((n, li) => {
      const s = [...speciesAt(li)], left = s.filter(i => !caught.has(i)).length;
      return `<li><button class="row prow" data-loc="${li}"><span>${esc(n)}</span><span>${left ? left + ' to catch' : '✔ all caught'} · ${s.length}</span></button></li>`;
    }).join('')}</ul>`;
}
function renderPlace(li) {
  const rows = atPlace.get(li) || [], s = [...speciesAt(li)];

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}
const clockText = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      <p class="note">HIT = types its own-type moves hit for ×2. FEAR = move types that hit it for ×2 or more. Tap a card for details.</p>`

setInterval(() => { const c = $('dock-clock'); if (c && currentView === 'dock') c.textContent = clockText(); }, 20000);

const VIEWS = ['list', 'detail', 'types', 'places', 'place', 'bosses', 'team', 'more', 'dock'];
const scrolls = {};
let currentHash = '', currentView = 'list';
function route() {
  const h = location.hash.replace('#', '');
  const pm = /^p(\d+)$/.exec(h), lm = /^l(\d+)$/.exec(h);
  const view = pm && byId.has(+pm[1]) ? 'detail' : lm && LOCS[+lm[1]] ? 'place' : VIEWS.includes(h) && h !== 'list' && h !== 'detail' && h !== 'place' ? h : 'list';
  scrolls[currentHash] = window.scrollY;
  if (view !== 'detail') lastList = view === 'list' ? '' : h;
  VIEWS.forEach(v => { $('view-' + v).hidden = v !== view; });
  const root = view === 'detail' ? (/^l\d+$/.test(lastList) ? 'places' : lastList || 'dex') : view === 'place' ? 'places' : view === 'list' ? 'dex' : view;
  ['dex', 'types', 'places', 'bosses', 'team'].forEach(t => $('tab-' + t).setAttribute('aria-selected', t === root));
  $('open-more').setAttribute('aria-pressed', view === 'more');
  document.body.classList.toggle('dock', view === 'dock');
  keepAwake(view === 'dock');
  const cameBack = currentView === 'detail' || (currentView === 'place' && view === 'places');
  if (view === 'detail') { state.allLocs = state.allTms = false; renderDetail(byId.get(+pm[1])); }
  else if (view === 'place') renderPlace(+lm[1]);
  else ({ list: renderList, types: renderTypes, places: renderPlaces, bosses: renderBosses, team: renderTeam, more: renderMore, dock: renderDock })[view]();
  if (!resultsEl.hidden) { qEl.value = ''; renderResults(); }
  const y = cameBack && view !== 'detail' ? scrolls[h] || 0 : 0;
  window.scrollTo(0, y);
  /* iOS can leave the sticky bars where they were if the page changed while it was mid-scroll; scrolling again settles them */
  requestAnimationFrame(() => { if (location.hash.replace('#', '') === h) window.scrollTo(0, y); });
  currentHash = h; currentView = view;
}
const go = h => { if (location.hash.replace('#', '') === h) route(); else location.hash = h; };
/* any element with data-id opens that Pokémon, data-loc that place */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-id]');
  if (a && a.closest('#results')) { const id = a.dataset.id; closeSearch(); return afterKeyboard(() => go('p' + id)); }
  if (a) return go('p' + a.dataset.id);
  const l = e.target.closest('[data-loc]'); if (l) return go('l' + l.dataset.loc);
});

$('typebar').innerHTML = T.map((_, t) => badge(t, 'button', ` data-t="${t}" aria-pressed="false"`)).join('');

/* ---- search: a bar at the bottom whose results open upward; while typing it rides on top of the keyboard ---- */
const vv = window.visualViewport;
/* the on-screen keyboard shrinks the visual viewport but not the layout the fixed bar is placed in */
const keyboardHeight = () => vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
let keyboardWasOpen = false;
function ride() {
  const kb = keyboardHeight(), open = kb > 80;
  bottomEl.style.transform = kb > 0 ? `translateY(${-kb / zoom}px)` : '';
  bottomEl.classList.toggle('typing', open || document.activeElement === qEl);
  /* once the keyboard is gone, a no-op scroll makes iOS put the sticky bars back where they belong */
  if (keyboardWasOpen && !open) window.scrollTo(window.scrollX, window.scrollY);
  keyboardWasOpen = open;
}
if (vv) { vv.addEventListener('resize', ride); vv.addEventListener('scroll', ride); }
qEl.addEventListener('focus', ride);
qEl.addEventListener('blur', () => setTimeout(ride, 60));
function renderResults() {
  const q = qEl.value.trim().toLowerCase();
  $('q-clear').hidden = !qEl.value;
  if (!q) { resultsEl.hidden = true; resultsEl.innerHTML = ''; return; }
  const hits = M.filter(m => matches(m, q));
  if (state.dex === 'unova') hits.sort((a, b) => (a.u === undefined) - (b.u === undefined) || (a.u ?? a.i) - (b.u ?? b.i));
  const MAX = 40;
  resultsEl.hidden = false;
  resultsEl.innerHTML = hits.length
    ? hits.slice(0, MAX).map(m => `<button data-id="${m.i}">${pic(m)}<span><span class="no">#${num(m)}</span><br><span class="nm">${esc(m.n)}${marks(m)}</span></span><span class="tys">${m.t.map(t => badge(t)).join('')}</span></button>`).join('')
      + (hits.length > MAX ? `<div class="empty">${hits.length - MAX} more. Keep typing to narrow it down.</div>` : '')

  resultsEl.scrollTop = 0;
}
function closeSearch() { qEl.value = ''; renderResults(); qEl.blur(); ride(); }
/* Changing page while the keyboard is still sliding away leaves iOS with its bars in the wrong place, so wait for it to finish. */
function afterKeyboard(fn) {
  if (!vv || keyboardHeight() < 80) return fn();
  let done = false;
  const run = () => { if (done) return; done = true; vv.removeEventListener('resize', check); fn(); };
  const check = () => { if (keyboardHeight() < 80) run(); };
  vv.addEventListener('resize', check);
  setTimeout(run, 700);
}

$('view-more').addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]');
  if (z) { zoom = +z.dataset.zoom; store('zoom', String(zoom)); applyZoom(); return renderMore(); }
  const copyOut = (text, what) => {
    const box = $('widget-out'), done = t => { $('widget-msg').textContent = t; };
    const fallback = () => { box.hidden = false; box.value = text; box.focus(); box.select(); done('Could not copy automatically. The text is selected below: use Copy from the menu.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(what + ' copied.'), fallback);
    else fallback();
  };
  if (e.target.closest('#widget-copy')) copyOut(WIDGET_SCRIPT, 'Widget script');
  if (e.target.closest('#team-copy')) copyOut(makeCode(), 'Team code');
  if (e.target.closest('#code-copy')) {
    const box = $('code-out'), done = t => { $('opt-msg').textContent = t; };
    const fallback = () => { box.focus(); box.select(); done('Code selected. Use Copy from the menu.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(() => done('Backup code copied.'), fallback);
    else fallback();

  if (e.target.closest('#code-load')) {
    try {
