<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex White</title>
<meta http-equiv="refresh" content="0; url=../">
<script>
/* The app moved up one folder. Drop the old offline copy, then go to the new address. */
(async () => {
  try { for (const r of await navigator.serviceWorker.getRegistrations()) if (r.scope.includes('/pokedex-pwa/')) await r.unregister(); } catch (e) {}
  location.replace('../' + location.hash);
})();
</script>
</head>
<body><p><a href="../">Pokédex đã chuyển sang địa chỉ mới. Bấm vào đây.</a></p></body>
</html>
